<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members only — Belpire Carnival</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E0B10">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@500;700&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/denied/denied.js" defer></script>
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <main class="closing">
    <p class="eyebrow">MEMBERS ONLY</p>
    <h2 id="denied-title">This tent is for Carnival members.</h2>
    <p id="denied-text">Log in with the Discord account you use in the Belpire Carnival server. If you're not in the server yet, join first, then come back.</p>
    <div class="hero-ctas">
      <a class="btn btn-gold" data-discord href="#">Join the Discord</a>
      <a class="btn btn-ghost" href="/auth/login">Try logging in again</a>
      <a class="btn btn-ghost" href="/">Back to the Carnival</a>
    </div>
  </main>
</body>
</html>
