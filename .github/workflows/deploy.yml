name: Deploy to Cloudflare Pages

# Production: every push to main, every 6 hours (Steam feed refresh), or on demand.
# Preview: pull requests from branches in this repo get their own preview URL.
# The feed is never committed. Each run downloads the live feed.json, refreshes it
# from Steam, and deploys — so main can stay fully protected.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *' # UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned tooling
        run: npm ci --no-audit --no-fund

      - name: Download the live feed
        run: |
          mkdir -p site/data
          base="${SITE_URL:-https://${CF_PAGES_PROJECT}.pages.dev}"
          if curl -fsSL --max-time 20 "${base%/}/data/feed.json" -o site/data/feed.json; then
            echo "Loaded live feed from ${base}"
          else
            rm -f site/data/feed.json
            echo "No live feed yet; starting fresh (Discord posts are skipped on a fresh start)."
          fi

      - name: Refresh feed from Steam
        id: feed
        run: node scripts/update-feed.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Deploy
        if: github.event_name != 'schedule' || steps.feed.outputs.changed == 'true'
        run: npx wrangler pages deploy site --project-name="$CF_PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    # Same-repo PRs only: fork PRs and Dependabot PRs never receive deploy secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: preview
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SITE_URL: ${{ vars.SITE_URL }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned tooling
        run: npm ci --no-audit --no-fund

      - name: Use the live feed for the preview
        run: |
          mkdir -p site/data
          base="${SITE_URL:-https://${CF_PAGES_PROJECT}.pages.dev}"
          curl -fsSL --max-time 20 "${base%/}/data/feed.json" -o site/data/feed.json || rm -f site/data/feed.json

      - name: Deploy preview
        run: npx wrangler pages deploy site --project-name="$CF_PAGES_PROJECT" --branch="pr-${PR_NUMBER}" --commit-hash="$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
