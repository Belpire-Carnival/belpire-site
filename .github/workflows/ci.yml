name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No npm dependencies (and no lockfile), so turn off setup-node's automatic npm cache.
          package-manager-cache: false

      - name: Syntax check and unit tests
        run: npm run check

      - name: Validate JSON config
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/games.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.github/rulesets/main.json','utf8'))"
